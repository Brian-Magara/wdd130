<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Whitewater Rafting Co. for bookings and inquiries">
    <meta name="author" content="Brian Magara">
    <title>Contact Us | Whitewater Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="contact-hero">
            <h1>Contact Our Team</h1>
        </div>

        <div class="contact-container">
            <section class="contact-info">
                <h2>Our Office</h2>
                <address>
                    <p>506 River Road<br>Nairobi City, Sagana 2345</p>
                    <p>Phone: <a href="tel:+25451234567">(254) 123-4567</a></p>
                    <p>Email: <a href="mailto:info@whitewaterrafting.com">info@whitewaterrafting.com</a></p>
                </address>
                
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3989.5140329241494!2d37.24288747404224!3d-0.7076293352655111!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2ske!4v1750201344745!5m2!1sen!2ske" 
                            width="600" 
                            height="450" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade"
                            title="Our Location Map">
                    </iframe>
                </div>
            </section>

            <section class="contact-form">
                <h2>Send Us a Message</h2>
                <form id="contactForm" action="thank-you.html" method="post">
                    <div class="form-group">
                        <label for="fullName">Full Name*:</label>
                        <input type="text" id="fullName" name="fullName" required minlength="3">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email*:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="tripInterest">Trip Interest:</label>
                        <select id="tripInterest" name="tripInterest">
                            <option value="" selected disabled>Select a trip</option>
                            <option value="beginner">Beginner's Delight</option>
                            <option value="intermediate">Intermediate Challenge</option>
                            <option value="advanced">Advanced Adventure</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Your Message*:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Subscribe to our newsletter</label>
                    </div>
                    
                    <button type="submit">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Whitewater Rafting Co. | Brian Magara</p>
        <nav class="sociallinks">
            <a href="https://facebook.com"><img src="images/facebook-icon.png" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter-icon.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram-icon.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>
</html>
